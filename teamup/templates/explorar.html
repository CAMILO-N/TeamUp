<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar · TeamUp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

    <!-- Barra superior -->
    <header class="navbar">
        <a href="{{ url_for('principal.explorar') }}" class="logo">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="TeamUp">
        </a>
        <nav class="navbar-links">
            <span class="link">@{{ current_user.nombreUsuario }}</span>
            <a href="{{ url_for('auth.logout') }}" class="btn btn-secundario">Cerrar sesión</a>
        </nav>
    </header>

    <main>
        <section class="explorar">
            <h1>Hola, <span class="resaltado">{{ current_user.primerNombreUsuario }}</span>.</h1>
            <p>Aquí vas a encontrar los proyectos de tu campus. Muy pronto podrás publicar el tuyo.</p>
        </section>
    </main>

</body>
</html>
