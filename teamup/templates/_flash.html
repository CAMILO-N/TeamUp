{# Avisos de flash(): flash("texto", "success"), flash("texto", "info") o flash("texto", "error") #}
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, text in messages %}
<div class="notice notice--{{ category if category in ('success', 'info') else 'error' }}">{{ text }}</div>
{% endfor %}
{% endwith %}
