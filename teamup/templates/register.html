<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <main class="auth">
        <img class="auth__logo" src="/static/img/logo.png" alt="TeamUp">
        <p class="auth__slogan">Juntos, las ideas despegan.</p>

        <section class="card">
            <h1>Crea tu cuenta</h1>
            <p class="card__sub">Únete con tu correo institucional y empieza a hacer equipo.</p>

            <div class="error" id="error"></div>

            <form method="POST" action="/register" id="form-registro" novalidate>
                <div class="field">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Nombre y apellido" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="correo">Correo institucional</label>
                    <input type="email" id="correo" name="correo" placeholder="tu.nombre@universidad.edu.ec" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="universidad">Universidad</label>
                    <select id="universidad" name="universidad" required>
                        <option value="" disabled selected>Selecciona tu universidad</option>
                        <option>Escuela Politécnica Nacional (EPN)</option>
                        <option>Escuela Superior Politécnica de Chimborazo (ESPOCH)</option>
                        <option>Escuela Superior Politécnica del Litoral (ESPOL)</option>
                        <option>Pontificia Universidad Católica del Ecuador (PUCE)</option>
                        <option>Universidad Andina Simón Bolívar</option>
                        <option>Universidad Casa Grande</option>
                        <option>Universidad Católica de Santiago de Guayaquil (UCSG)</option>
                        <option>Universidad Central del Ecuador (UCE)</option>
                        <option>Universidad de Cuenca</option>
                        <option>Universidad de Guayaquil</option>
                        <option>Universidad de las Américas (UDLA)</option>
                        <option>Universidad de las Fuerzas Armadas (ESPE)</option>
                        <option>Universidad del Azuay (UDA)</option>
                        <option>Universidad Espíritu Santo (UEES)</option>
                        <option>Universidad Internacional del Ecuador (UIDE)</option>
                        <option>Universidad Nacional de Chimborazo (UNACH)</option>
                        <option>Universidad Nacional de Loja (UNL)</option>
                        <option>Universidad Politécnica Salesiana (UPS)</option>
                        <option>Universidad San Francisco de Quito (USFQ)</option>
                        <option>Universidad Técnica de Ambato (UTA)</option>
                        <option>Universidad Técnica de Manabí (UTM)</option>
                        <option>Universidad Técnica del Norte (UTN)</option>
                        <option>Universidad Técnica Particular de Loja (UTPL)</option>
                        <option>Universidad UTE</option>
                        <option>Yachay Tech</option>
                        <option>Otra universidad</option>
                    </select>
                </div>

                <div class="row">
                    <div class="field">
                        <label for="carrera">Carrera</label>
                        <input type="text" id="carrera" name="carrera" placeholder="Ej. Audiovisuales" required>
                    </div>
                    <div class="field">
                        <label for="semestre">Semestre</label>
                        <select id="semestre" name="semestre" required>
                            <option value="" disabled selected>Elige</option>
                            <option>1</option><option>2</option><option>3</option>
                            <option>4</option><option>5</option><option>6</option>
                            <option>7</option><option>8</option><option>9</option>
                            <option>10</option><option>Egresado</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" required>
                </div>

                <div class="field">
                    <label for="password2">Confirmar contraseña</label>
                    <input type="password" id="password2" name="password2" placeholder="Repite tu contraseña" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn">Crear cuenta</button>
            </form>
        </section>

        <p class="auth__alt">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
    </main>

    <script>
        var box = document.getElementById("error");

        function mostrarError(texto) {
            box.textContent = texto;
            box.classList.add("visible");
        }

        // Mensaje enviado por el servidor: /register?error=...
        var msg = new URLSearchParams(window.location.search).get("error");
        if (msg) mostrarError(msg);

        // Validación básica antes de enviar
        document.getElementById("form-registro").addEventListener("submit", function (e) {
            var f = e.target;
            if (!f.nombre.value.trim() || !f.correo.value.trim() || !f.universidad.value ||
                !f.carrera.value.trim() || !f.semestre.value || !f.password.value) {
                e.preventDefault();
                return mostrarError("Completa todos los campos.");
            }
            if (f.password.value.length < 8) {
                e.preventDefault();
                return mostrarError("La contraseña debe tener al menos 8 caracteres.");
            }
            if (f.password.value !== f.password2.value) {
                e.preventDefault();
                return mostrarError("Las contraseñas no coinciden.");
            }
        });
    </script>
</body>
</html>
