<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <main class="auth">
        <img class="auth__logo" src="/static/img/logo.png" alt="TeamUp">
        <p class="auth__slogan">Juntos, las ideas despegan.</p>

        <section class="card">
            <h1>Inicia sesión</h1>
            <p class="card__sub">Entra para publicar proyectos y armar tu equipo.</p>

            <div class="error" id="error"></div>

            <form method="POST" action="/login" novalidate>
                <div class="field">
                    <label for="correo">Correo institucional</label>
                    <input type="email" id="correo" name="correo" placeholder="tu.nombre@universidad.edu.ec" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn">Entrar</button>
            </form>
        </section>

        <p class="auth__alt">¿Aún no tienes cuenta? <a href="/register">Regístrate</a></p>
    </main>

    <script>
        // Muestra un mensaje de error si la URL trae ?error=...
        var params = new URLSearchParams(window.location.search);
        var msg = params.get("error");
        if (msg) {
            var box = document.getElementById("error");
            box.textContent = msg;
            box.classList.add("visible");
        }
    </script>
</body>
</html>
